<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Sign Up - HireHub</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <div class="app-container">
        <div class="top-bar">
            <a href="join.html" class="back-btn"><i class="fa-solid fa-arrow-left"></i></a>
        </div>
        
        <div class="p-4">
            <h2 style="font-size: 1.5rem; margin-bottom: 0.5rem;">Create your account</h2>
            <p class="text-muted text-sm" style="margin-bottom: 2rem;">Let's get you started</p>
            
            <form id="signup-form">
                <div class="form-group">
                    <label>Full Name</label>
                    <input type="text" id="fullname" class="form-control" placeholder="Enter your full name">
                </div>
                
                <div class="form-group">
                    <label>Email</label>
                    <input type="email" id="email" class="form-control" placeholder="Enter your email">
                </div>
                
                <div class="form-group">
                    <label>Password</label>
                    <div class="input-icon-wrapper">
                        <input type="password" id="password" class="form-control" placeholder="Create a password">
                        <i class="fa-regular fa-eye"></i>
                    </div>
                </div>

                <button type="submit" id="signup-btn" class="btn btn-primary" style="margin-top: 2rem;">Create Account</button>
            </form>

            <div class="text-center mt-4 text-sm text-muted">
                By signing up, you agree to our<br>
                <a href="#" class="text-primary" style="text-decoration: none;">Terms of Service</a> and 
                <a href="#" class="text-primary" style="text-decoration: none;">Privacy Policy</a>.
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="js/auth.js"></script>
</body>
</html>
