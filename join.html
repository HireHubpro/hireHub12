<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Join - HireHub</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <div class="app-container">
        <div class="top-bar">
            <a href="index.html" class="back-btn"><i class="fa-solid fa-arrow-left"></i></a>
        </div>
        
        <div class="p-4">
            <h2 style="font-size: 1.5rem; margin-bottom: 2rem;">Choose how you want<br>to join HireHub</h2>
            
            <a href="signup.html" class="role-card" style="border-color: var(--primary); background: #f0f7ff;">
                <div class="role-icon"><i class="fa-regular fa-user"></i></div>
                <div class="role-text">
                    <h3>Join as Applicant</h3>
                    <p>Find opportunities and grow your career.</p>
                </div>
                <i class="fa-solid fa-chevron-right role-arrow"></i>
            </a>

            <a href="signup.html" class="role-card">
                <div class="role-icon" style="background: #e6f4ea; color: #16a34a;"><i class="fa-solid fa-briefcase"></i></div>
                <div class="role-text">
                    <h3>Join as Hirer</h3>
                    <p>Post jobs, find talent and build your team.</p>
                </div>
                <i class="fa-solid fa-chevron-right role-arrow"></i>
            </a>

            <div class="text-center mt-4 text-sm text-muted" style="margin-top: 3rem;">
                Already have an account? <a href="#" class="text-primary" style="text-decoration: none; font-weight: 500;">Log in</a>
            </div>
        </div>
    </div>
</body>
</html>
