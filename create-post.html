<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Create Post - HireHub</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <div class="app-container">
        <div class="feed-header">
            <div class="logo"><i class="fa-solid fa-pen-to-square"></i> Share an Update</div>
            <a href="feed.html" style="color: #666; text-decoration: none; font-size: 0.9rem;"><i class="fa-solid fa-xmark"></i> Cancel</a>
        </div>

        <div style="padding: 1.5rem; display: flex; flex-direction: column; gap: 1rem; flex-grow: 1;">
            
            <textarea id="new-post-input" placeholder="What do you want to talk about?" style="width: 100%; height: 150px; border: none; resize: none; font-size: 1.1rem; outline: none; font-family: inherit;" autofocus></textarea>
            
            <div style="display: flex; flex-direction: column; gap: 0.5rem; margin-bottom: 1rem;">
                <label for="post-image-input" style="cursor: pointer; color: #0a66c2; font-weight: 600; display: flex; align-items: center; gap: 0.5rem; width: fit-content; padding: 0.5rem 0;">
                    <i class="fa-regular fa-image" style="font-size: 1.3rem;"></i> Add a photo
                </label>
                <input type="file" id="post-image-input" accept="image/*" style="display: none;">
                
                <img id="post-image-preview" style="max-height: 200px; width: 100%; object-fit: cover; border-radius: 8px; display: none; border: 1px solid #ddd;">
            </div>
            
            <button id="create-post-btn" style="width: 100%; background-color: #0a66c2; color: white; border: none; padding: 0.75rem; border-radius: 20px; font-weight: bold; font-size: 1rem; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 0.5rem; margin-top: auto;">
                <i class="fa-solid fa-paper-plane"></i> Share Post
            </button>
        </div>

        <div class="bottom-nav">
            <a href="feed.html" class="nav-item"><i class="fa-solid fa-house"></i>Home</a>
            <a href="create-post.html" class="nav-item active"><i class="fa-solid fa-square-plus"></i>Post</a>
            <a href="inbox.html" class="nav-item"><i class="fa-solid fa-inbox"></i>Inbox</a>
            <a href="profile.html" class="nav-item"><i class="fa-regular fa-user"></i>Profile</a>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="js/app.js"></script>
</body>
</html>
